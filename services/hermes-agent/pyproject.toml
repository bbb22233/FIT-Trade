[project]
name = "hermes-agent-contracts"
version = "0.1.0"
description = "FIT-Trade Hermes Agent — P0 contract conformance and validation layer"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }

dependencies = [
    "pydantic==2.8.2",
    "jsonschema==4.26.0",
    "referencing==0.37.0",
    "rfc8785==0.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-xdist==3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
