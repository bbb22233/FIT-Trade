<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hermes Command · Design QA Comparison</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #05090c; color: #dfe7ee; }
      body { font-family: Inter, system-ui, sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; min-height: 100vh; }
      figure { display: flex; min-width: 0; margin: 0; flex-direction: column; background: #0b131a; }
      figcaption { height: 42px; padding: 12px 16px; border-bottom: 1px solid #263540; font-size: 13px; }
      img { display: block; width: 100%; height: auto; object-fit: contain; object-position: top; }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>目标：Institutional Risk Desk</figcaption>
        <img src="/reference/institutional-risk-desk.png" alt="目标界面" />
      </figure>
      <figure>
        <figcaption>实现：Operation 独占门 / 原票据继续推进</figcaption>
        <img src="/qa-operation-exclusive-lock.png" alt="Operation 独占门实现界面" />
      </figure>
    </main>
  </body>
</html>
