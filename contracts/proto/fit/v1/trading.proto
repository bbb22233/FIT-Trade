syntax = "proto3";

package fit.v1;

option go_package = "github.com/bbb22233/FIT-Trade/services/trading-core/gen/fit/v1;fitv1";

// Financial values are canonical decimal strings. Implementations must not
// convert them through binary floating point.
message StopMarket {
  string type = 1;
  string trigger_price = 2;
  bool reduce_only = 3;
}

message TakeProfitLeg {
  string trigger_price = 1;
  string quantity_fraction = 2;
  bool reduce_only = 3;
}

message TradeIntent {
  string schema_version = 1;
  string intent_id = 2;
  string user_id = 3;
  string account_id = 4;
  string network = 5;
  string symbol = 6;
  string side = 7;
  string position_effect = 8;
  string order_type = 9;
  string time_in_force = 10;
  string quantity = 11;
  string notional = 12;
  string margin_mode = 13;
  uint32 leverage = 14;
  string entry_price_or_bound = 15;
  string worst_acceptable_price = 16;
  StopMarket stop = 17;
  repeated TakeProfitLeg take_profit_plan = 18;
  string risk_policy_version = 19;
  string market_snapshot_id = 20;
  string strategy_version = 21;
  string model_version = 22;
  string source = 23;
  string created_at = 24;
}

message ConfirmationTicket {
  string schema_version = 1;
  string confirmation_id = 2;
  string device_id = 3;
  string session_id = 4;
  TradeIntent intent = 5;
  string maximum_loss = 6;
  string maximum_loss_fraction = 7;
  string post_trade_total_risk = 8;
  string post_trade_total_risk_fraction = 9;
  string liquidation_price = 10;
  string estimated_fees = 11;
  string slippage_budget = 12;
  string expires_at = 13;
  string confirmation_nonce = 14;
  string confirmation_hash = 15;
  string created_at = 16;
}

message Operation {
  string schema_version = 1;
  string operation_id = 2;
  string intent_id = 3;
  string confirmation_id = 4;
  string state = 5;
  optional uint64 state_version = 6;
  string rejection_code = 7;
  string created_at = 8;
  string updated_at = 9;
}

message ExecutionAttempt {
  string schema_version = 1;
  string attempt_id = 2;
  string operation_id = 3;
  string client_order_id = 4;
  uint32 attempt_number = 5;
  string state = 6;
  string created_at = 7;
}

message Order {
  string schema_version = 1;
  string order_id = 2;
  string operation_id = 3;
  string client_order_id = 4;
  string exchange_order_id = 5;
  string symbol = 6;
  string side = 7;
  string quantity = 8;
  string filled_quantity = 9;
  string limit_price = 10;
  optional bool reduce_only = 11;
  string state = 12;
  string updated_at = 13;
}

message Fill {
  string schema_version = 1;
  string fill_id = 2;
  string order_id = 3;
  string symbol = 4;
  string side = 5;
  string quantity = 6;
  string price = 7;
  string fee = 8;
  string occurred_at = 9;
}

message PositionSnapshot {
  string schema_version = 1;
  string position_id = 2;
  string account_id = 3;
  string symbol = 4;
  string signed_quantity = 5;
  string entry_price = 6;
  string mark_price = 7;
  string protection_status_id = 8;
  string protection_state = 9;
  string data_status = 10;
  string snapshot_at = 11;
}

message SymbolLeverage {
  string symbol = 1;
  uint32 maximum_leverage = 2;
}

message RiskPolicy {
  string schema_version = 1;
  string risk_policy_version = 2;
  repeated string allowed_symbols = 3;
  string maximum_trade_risk_fraction = 4;
  string maximum_total_risk_fraction = 5;
  repeated SymbolLeverage maximum_leverage_by_symbol = 6;
  string maximum_slippage_fraction = 7;
  string created_at = 8;
}

message AutomationGrant {
  string schema_version = 1;
  string grant_id = 2;
  string user_id = 3;
  string account_id = 4;
  string state = 5;
  repeated string allowed_symbols = 6;
  string risk_policy_version = 7;
  string strategy_version = 8;
  string model_version = 9;
  string review_model_version = 10;
  string maximum_notional = 11;
  string authorization_hash = 12;
}

message ModelProposal {
  string schema_version = 1;
  string proposal_id = 2;
  string model_version = 3;
  string decision = 4;
  TradeIntent intent = 5;
  string created_at = 6;
}

message ModelReview {
  string schema_version = 1;
  string review_id = 2;
  string proposal_id = 3;
  string review_model_version = 4;
  string decision = 5;
  repeated string reason_codes = 6;
  string created_at = 7;
}

message AuditEvent {
  string schema_version = 1;
  string event_id = 2;
  string event_type = 3;
  string actor_type = 4;
  string subject_type = 5;
  string subject_id = 6;
  string occurred_at = 7;
  string payload_hash = 8;
}

message AuthenticatedScope {
  string user_id = 1;
  string account_id = 2;
  string device_id = 3;
  string session_id = 4;
}

message RiskDecision {
  string schema_version = 1;
  string decision_id = 2;
  string intent_id = 3;
  string risk_policy_version = 4;
  string result = 5;
  repeated string reason_codes = 6;
  string admitted_quantity = 7;
  string maximum_loss = 8;
  string maximum_loss_fraction = 9;
  string post_trade_total_risk = 10;
  string post_trade_total_risk_fraction = 11;
  string market_snapshot_id = 12;
  string decided_at = 13;
}

message ExecutionCommand {
  string schema_version = 1;
  string command_id = 2;
  string operation_id = 3;
  string attempt_id = 4;
  string authorization_type = 5;
  string authorization_id = 6;
  string action = 7;
  string client_order_id = 8;
  string symbol = 9;
  string side = 10;
  string order_type = 11;
  string time_in_force = 12;
  string quantity = 13;
  string worst_acceptable_price = 14;
  optional bool reduce_only = 15;
  string created_at = 16;
}

message ExecutionResult {
  string schema_version = 1;
  string result_id = 2;
  string command_id = 3;
  string attempt_id = 4;
  string status = 5;
  string exchange_order_id = 6;
  string error_code = 7;
  string observed_at = 8;
}

message ProtectionStatus {
  string schema_version = 1;
  string protection_status_id = 2;
  string position_id = 3;
  string state = 4;
  string absolute_live_position_quantity = 5;
  repeated string active_stop_order_ids = 6;
  string coverage_evidence_hash = 7;
  string data_status = 8;
  string observed_at = 9;
}

message ReconciliationStatus {
  string schema_version = 1;
  string reconciliation_id = 2;
  string operation_id = 3;
  string attempt_id = 4;
  string client_order_id = 5;
  string state = 6;
  repeated string evidence_sources = 7;
  string exchange_order_id = 8;
  string checked_at = 9;
}

message AgentFeedback {
  string schema_version = 1;
  string feedback_id = 2;
  string operation_id = 3;
  string user_id = 4;
  string account_id = 5;
  optional sint32 rating = 6;
  string comment = 7;
  optional bool include_in_learning = 8;
  string created_at = 9;
}

message AutomationAuthorization {
  string schema_version = 1;
  string authorization_id = 2;
  string grant_id = 3;
  string user_id = 4;
  string account_id = 5;
  string device_id = 6;
  string session_id = 7;
  string risk_policy_version = 8;
  string strategy_version = 9;
  string model_version = 10;
  string review_model_version = 11;
  repeated string allowed_symbols = 12;
  string maximum_notional = 13;
  string authorization_hash = 14;
  string authorized_at = 15;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  VALIDATION_FAILED = 1;
  UNAUTHENTICATED = 2;
  SCOPE_MISMATCH = 3;
  TOOL_NOT_AUTHORIZED = 4;
  CONFIRMATION_REQUIRED = 5;
  CONFIRMATION_EXPIRED = 6;
  CONFIRMATION_MISMATCH = 7;
  CONFIRMATION_ALREADY_CONSUMED = 8;
  RISK_REJECTED = 9;
  DATA_STALE = 10;
  STATE_TRANSITION_REJECTED = 11;
  DUPLICATE_REQUEST = 12;
  UPSTREAM_UNAVAILABLE = 13;
  UNKNOWN_REQUIRES_RECONCILIATION = 14;
  MANUAL_RECONCILIATION_REQUIRED = 15;
  INTERNAL_ERROR = 16;
}

enum RetryClass {
  RETRY_CLASS_UNSPECIFIED = 0;
  NEVER = 1;
  NEVER_SAME_INPUT = 2;
  NEVER_SAME_TICKET = 3;
  NEVER_SAME_TRANSITION = 4;
  AFTER_REAUTHENTICATION = 5;
  AFTER_NEW_CONFIRMATION = 6;
  AFTER_NEW_INTENT = 7;
  AFTER_FRESH_SNAPSHOT = 8;
  RETURN_EXISTING_RESULT = 9;
  BOUNDED_BACKOFF_BEFORE_DISPATCH = 10;
  RECONCILE_ONLY = 11;
  OPERATOR_ONLY = 12;
  POLICY_DEPENDENT = 13;
}

message ErrorDetail {
  ErrorCode code = 1;
  RetryClass retry = 2;
  string correlation_id = 3;
  string redacted_message = 4;
}

message SubmitIntentRequest {
  TradeIntent intent = 1;
}

message SubmitIntentResponse {
  string intent_id = 1;
  string status = 2;
}

message RequestConfirmationRequest {
  string intent_id = 1;
}

message RequestConfirmationResponse {
  ConfirmationTicket ticket = 1;
}

message ConsumeConfirmationRequest {
  // Populated by authenticated server middleware, never by model output.
  AuthenticatedScope scope = 1;
  string confirmation_id = 2;
  string confirmation_hash = 3;
  string idempotency_key = 4;
}

message ConsumeConfirmationResponse {
  Operation operation = 1;
}

message GetOperationRequest {
  string operation_id = 1;
}

message GetOperationResponse {
  Operation operation = 1;
}

service TradingCore {
  rpc SubmitIntent(SubmitIntentRequest) returns (SubmitIntentResponse);
  rpc RequestConfirmation(RequestConfirmationRequest)
      returns (RequestConfirmationResponse);
  rpc ConsumeConfirmation(ConsumeConfirmationRequest)
      returns (ConsumeConfirmationResponse);
  rpc GetOperation(GetOperationRequest) returns (GetOperationResponse);
}
